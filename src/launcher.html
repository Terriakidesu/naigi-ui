<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; connect-src 'none'">
    <title>Connect to Naigi</title>
    <link rel="stylesheet" href="launcher.css">
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">N</span>
      <h1>Naigi</h1>
      <p>Your conversations. Your server.</p>
      <section id="saved-servers" class="saved-servers" aria-labelledby="saved-servers-heading" hidden>
        <h2 id="saved-servers-heading">Saved servers</h2>
        <p class="saved-servers-help">Select a server to connect. Forgetting removes only this shortcut.</p>
        <ul id="saved-server-list"></ul>
      </section>
      <form id="connect-form">
        <label for="server">Server address</label>
        <input id="server" type="url" placeholder="https://chat.example.com" required autocomplete="url" autofocus>
        <button id="check-server" class="secondary" type="button">Check server</button>
        <button id="connect" type="submit">Connect</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section class="version-card" aria-label="Version information">
        <div><span>Desktop app</span><strong id="app-version">Checking…</strong></div>
        <div><span>Naigi server</span><strong id="server-version">Not checked</strong></div>
      </section>
      <small>HTTPS required. Local development can use http://localhost:3000.</small>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
