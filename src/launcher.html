<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
    <title>Connect to Naigi</title>
    <link rel="stylesheet" href="launcher.css">
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">N</span>
      <h1>Naigi</h1>
      <p>Your conversations. Your server.</p>
      <form id="connect-form">
        <label for="server">Server address</label>
        <input id="server" type="url" placeholder="https://chat.example.com" required autocomplete="url" autofocus>
        <button id="connect" type="submit">Connect</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <small>HTTPS required. Local development can use http://localhost:3000.</small>
    </main>
    <script src="launcher.js"></script>
  </body>
</html>
